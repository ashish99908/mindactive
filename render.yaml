services:
  # ---------- Backend API (Express + PostgreSQL via Neon free tier) ----------
  - type: web
    name: smritiloom-api
    runtime: node
    plan: free            # free tier - data stored in Neon PostgreSQL, not local disk
    rootDir: backend
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /api/health
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: GROQ_API_KEY
        sync: false        # set manually in the Render dashboard (secret)
      - key: FRONTEND_URL
        sync: false        # set after the frontend service exists, e.g. https://smritiloom.onrender.com
      - key: DATABASE_URL
        sync: false        # set to your Neon PostgreSQL connection string
      - key: NODE_VERSION
        value: "20"

  # ---------- Frontend (static React build served by Render) ----------
  - type: web
    name: smritiloom-web
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        sync: false        # set after the backend service exists, e.g. https://smritiloom-api.onrender.com/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html   # SPA client-side routing
